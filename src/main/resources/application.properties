spring.application.name=logshield-v2

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

springdoc.packages-to-scan=com.logshield.logshieldv2.controller
springdoc.paths-to-match=/api/v1/**

# Actuator ? expose health endpoint for Docker health check
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ?? Database Configuration ????????????????????????????????????????????
# H2 in-memory database ? zero setup, perfect for development and demo
# Switch datasource URL to PostgreSQL for production deployment
spring.datasource.url=jdbc:h2:file:./data/logshield-db;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate configuration
# create-drop: creates schema on startup, drops on shutdown
# update: keeps existing data between restarts (use this after first run)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# H2 console ? accessible at http://localhost:8080/h2-console during dev
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console